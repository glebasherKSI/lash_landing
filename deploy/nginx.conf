# /etc/nginx/sites-available/orlova-lash
# Сертификат: sudo certbot --nginx -d example.by -d www.example.by
server {
    listen 80;
    server_name example.by www.example.by;
    return 301 https://example.by$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.by;

    # ssl_certificate и ssl_certificate_key добавит certbot

    client_max_body_size 200m;   # массовая загрузка фото в админке

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # Загруженные фото и статика отдаются nginx напрямую
    location /uploads/ {
        alias /var/www/orlova-lash/public/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
